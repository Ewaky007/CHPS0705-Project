version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: kapture_db
    environment:
      MYSQL_ROOT_PASSWORD: kapture
      MYSQL_DATABASE: kapture
    ports:
      - "3306:3306"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - kapture_data:/var/lib/mysql

volumes:
  kapture_data: